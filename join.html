<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <title>A1 Kitchen | Event Food Tickets</title>
    <link rel="icon" type="image/png" href="images/logo-mark.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <header class="site-header">
      <a class="brand" href="index.html"
        ><img
          src="images/logo-wide.webp"
          alt="A1 Kitchen home page"
          width="260"
          height="68"
      /></a>
    </header>
    <main id="main-content">
      <section class="page-hero">
        <p class="home-eyebrow">Catering by A1 Kitchen</p>
        <h1>Event <span>Food Tickets</span></h1>
        <p class="page-lead">
          Register in a minute and get your food ticket on your phone. Show it
          at the serving area.
        </p>
      </section>
      <section class="events-wrap">
        <p
          id="join-message"
          class="success-message"
          role="status"
          aria-live="polite"
        ></p>
        <div id="join-view"></div>
      </section>
    </main>
    <footer>
      <img
        class="footer-logo"
        src="images/logo-wide.webp"
        alt="A1 Kitchen"
        width="200"
        height="53"
        loading="lazy"
      />
      <p>Food • Catering • Events</p>
    </footer>
    <script src="supabase-config.js"></script>
    <script src="site-info.js"></script>
    <script src="qr-code.js"></script>
    <script src="ticket-pdf.js"></script>
    <script src="join.js"></script>
  </body>
</html>
