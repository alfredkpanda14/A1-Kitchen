<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>A1 Kitchen | Certificates</title>
    <link rel="icon" type="image/png" href="images/logo-mark.png" />
    <link rel="stylesheet" href="style.css" />
    <script src="theme-init.js"></script>
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <header class="site-header">
      <a class="brand" href="chef-dashboard.html"
        ><img
          src="images/logo-wide.webp"
          alt="A1 Kitchen staff dashboard"
          width="260"
          height="68"
      /></a>
      <nav aria-label="Staff navigation">
        <a href="chef-dashboard.html">Orders</a>
        <a href="menu-manager.html" id="nav-menu" hidden>Menu manager</a>
        <a href="master-dashboard.html" id="nav-developer" hidden>Developer</a>
        <a href="events-manager.html" id="nav-events" hidden>Events</a>
        <a href="competitions-manager.html" id="nav-competitions" hidden
          >Competitions</a
        >
        <a href="certificates-manager.html" class="active" aria-current="page"
          >Certificates</a
        >
        <a href="index.html">View website</a>
      </nav>
    </header>
    <main id="main-content" class="staff">
      <section class="dash-hero">
        <p class="home-eyebrow">Awan Kitchen and Catering Services</p>
        <h1>Certificates</h1>
        <p id="welcome">Loading...</p>
        <div class="dash-bar">
          <button type="button" id="new-button" class="button">
            New certificate
          </button>
          <button
            type="button"
            id="refresh-button"
            class="button button-secondary"
          >
            Refresh
          </button>
          <button
            type="button"
            id="signout-button"
            class="button button-secondary"
          >
            Sign out
          </button>
        </div>
        <p
          id="dash-message"
          class="success-message"
          role="status"
          aria-live="polite"
        ></p>
      </section>

      <section id="editor-box" hidden></section>

      <section class="dash-panel">
        <h2>All Certificates</h2>
        <p id="cert-counts" class="cert-counts"></p>
        <div class="cert-filters">
          <div class="menu-field">
            <label for="filter-search">Search</label>
            <input
              type="search"
              id="filter-search"
              maxlength="80"
              autocomplete="off"
              placeholder="Name, number or competition"
            />
          </div>
          <div class="menu-field">
            <label for="filter-category">Kind</label>
            <select id="filter-category"></select>
          </div>
          <div class="menu-field">
            <label for="filter-status">Status</label>
            <select id="filter-status">
              <option value="">All</option>
              <option value="Draft">Draft</option>
              <option value="Valid">Valid</option>
              <option value="Revoked">Revoked</option>
              <option value="Replaced">Replaced</option>
            </select>
          </div>
          <div class="menu-field">
            <label for="filter-year">Year</label>
            <select id="filter-year"></select>
          </div>
          <div class="menu-field">
            <button type="button" id="filter-apply" class="button">Show</button>
          </div>
        </div>
        <div id="cert-list"></div>
        <p class="home-actions">
          <button
            type="button"
            id="more-button"
            class="button button-secondary"
            hidden
          >
            Show more
          </button>
        </p>
      </section>

      <section class="dash-panel">
        <h2>Signature and Signatory</h2>
        <div id="settings-box"></div>
      </section>
    </main>
    <footer>
      <p>&copy; 2026 A1 Kitchen. Staff area.</p>
    </footer>
    <datalist id="award-options">
      <option value="First Place"></option>
      <option value="Second Place"></option>
      <option value="Third Place"></option>
      <option value="Employee of the Month"></option>
      <option value="Employee of the Year"></option>
      <option value="Best Student"></option>
    </datalist>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="qr-code.js"></script>
    <script src="certificate-pdf.js"></script>
    <script src="certificates-manager.js"></script>
    <script src="site-extras.js" defer></script>
  </body>
</html>
