<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>A1 Kitchen | Staff Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="images/logo-mark.svg" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <header class="site-header">
      <a class="brand" href="chef-dashboard.html"
        ><img
          src="images/logo.svg"
          alt="A1 Kitchen staff dashboard"
          width="260"
          height="68"
      /></a>
    </header>

    <main id="main-content">
      <section>
        <h1>Staff Dashboard</h1>
        <p id="welcome">Loading...</p>

        <div class="dash-bar">
          <button type="button" id="refresh-button" class="button">
            Refresh
          </button>
          <button
            type="button"
            id="signout-button"
            class="button button-secondary"
          >
            Sign out
          </button>
        </div>

        <p id="last-updated" class="menu-notice"></p>
        <p
          id="dash-message"
          class="success-message"
          role="status"
          aria-live="polite"
        ></p>

        <div
          id="view-tabs"
          class="dash-tabs"
          role="group"
          aria-label="Dashboard sections"
        ></div>
      </section>

      <section id="orders-view" hidden>
        <h2>Orders</h2>

        <label for="order-search">Search by order number, name or phone</label>
        <input type="search" id="order-search" autocomplete="off" />

        <div
          id="order-tabs"
          class="dash-tabs"
          role="group"
          aria-label="Order filters"
        ></div>
        <div id="order-list"></div>
      </section>

      <section id="catering-view" hidden>
        <h2>Catering Requests</h2>
        <div id="catering-list"></div>
      </section>

      <section id="events-view" hidden>
        <h2>Family Outing Registrations</h2>
        <div id="events-list"></div>
      </section>

      <section>
        <h2>Change Your Password</h2>

        <form id="password-form">
          <label for="new-password">New password (at least 8 characters)</label>
          <input
            type="password"
            id="new-password"
            autocomplete="new-password"
            minlength="8"
            required
          />

          <label for="confirm-password">Type it again</label>
          <input
            type="password"
            id="confirm-password"
            autocomplete="new-password"
            minlength="8"
            required
          />

          <button type="submit" class="button">Change password</button>
        </form>

        <p
          id="password-message"
          class="success-message"
          role="status"
          aria-live="polite"
        ></p>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 A1 Kitchen. Staff area.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="chef-dashboard.js"></script>
  </body>
</html>
