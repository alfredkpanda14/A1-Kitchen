<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>A1 Kitchen | Staff Sign In</title>
    <link rel="icon" type="image/png" href="images/logo-mark.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="login-page">
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <main id="main-content" class="login-main">
      <section class="login-card">
        <div class="login-brand">
          <img
            src="images/logo-wide.webp"
            alt="A1 Kitchen"
            width="260"
            height="68"
          />
        </div>
        <h1>Staff Sign In</h1>
        <p>For A1 Kitchen staff only.</p>
        <form id="login-form">
          <label for="login-email">Email</label>
          <input
            type="email"
            id="login-email"
            autocomplete="username"
            required
          />
          <label for="login-password">Password</label>
          <input
            type="password"
            id="login-password"
            autocomplete="current-password"
            required
          />
          <button type="submit" class="button">Sign in</button>
        </form>
        <p
          id="login-message"
          class="success-message"
          role="status"
          aria-live="polite"
        ></p>
        <p class="login-back"><a href="index.html">← Back to the website</a></p>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="staff-login.js"></script>
  </body>
</html>
