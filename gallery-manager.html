<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>A1 Kitchen | Gallery Manager</title>
    <link rel="icon" type="image/png" href="images/logo-mark.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <header class="site-header">
      <a class="brand" href="chef-dashboard.html"
        ><img
          src="images/logo.webp"
          alt="A1 Kitchen staff dashboard"
          width="260"
          height="68"
      /></a>
      <nav aria-label="Staff navigation">
        <a href="chef-dashboard.html">Orders</a>
        <a href="menu-manager.html" id="nav-menu" hidden>Menu manager</a>
        <a href="master-dashboard.html" id="nav-developer" hidden>Developer</a>
        <a href="events-manager.html" id="nav-events" hidden>Events</a>
        <a href="gallery-manager.html" class="active" aria-current="page"
          >Gallery manager</a
        >
        <a href="index.html">View website</a>
      </nav>
    </header>
    <main id="main-content">
      <section>
        <h1>Gallery Manager</h1>
        <p id="welcome">Loading...</p>
        <div class="dash-bar">
          <button type="button" id="refresh-button" class="button">
            Refresh
          </button>
          <button
            type="button"
            id="signout-button"
            class="button button-secondary"
          >
            Sign out
          </button>
        </div>
        <p
          id="dash-message"
          class="success-message"
          role="status"
          aria-live="polite"
        ></p>
      </section>
      <section>
        <div id="upload-box"></div>
        <h2>Everything In The Gallery</h2>
        <div id="item-list"></div>
      </section>
    </main>
    <footer>
      <p>&copy; 2026 A1 Kitchen. Staff area.</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="gallery-manager.js"></script>
  </body>
</html>
